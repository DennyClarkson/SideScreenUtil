[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidescreenutil"
version = "0.6.0"
description = "Turn a selected Windows display into an OLED-safe live window monitor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SideScreenUtil contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "PySide6-Essentials>=6.8,<7",
  "pywin32>=308",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.11,<7",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.gui-scripts]
sidescreen = "sidescreen.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sidescreen = ["native/*.pyd", "native/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
