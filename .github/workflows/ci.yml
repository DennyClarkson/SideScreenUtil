name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    name: Test and package on Windows
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Run checks
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m ruff check src tests
          .\.venv\Scripts\python.exe -m pytest -q

      - name: Build optimized executable
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $Process = Start-Process -FilePath .\dist\SideScreenUtil.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($Process.ExitCode -ne 0) {
            throw "Packaged smoke test failed with exit code $($Process.ExitCode)."
          }
          $CaptureProcess = Start-Process -FilePath .\dist\SideScreenUtil.exe -ArgumentList '--capture-smoke-test' -Wait -PassThru
          if ($CaptureProcess.ExitCode -ne 0) {
            throw "Packaged capture smoke test failed with exit code $($CaptureProcess.ExitCode)."
          }

      - name: Upload packaged test artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideScreenUtil-ci-windows-x64
          path: dist/SideScreenUtil.exe
          if-no-files-found: error
          retention-days: 7
