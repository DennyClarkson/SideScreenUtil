name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    name: Test and package on Windows
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Run checks
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m ruff check src tests
          .\.venv\Scripts\python.exe -m pytest -q

      - name: Build optimized executable
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $Process = Start-Process -FilePath .\dist\SideScreenUtil.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($Process.ExitCode -ne 0) {
            throw "Packaged smoke test failed with exit code $($Process.ExitCode)."
          }
          $CaptureProcess = Start-Process -FilePath .\dist\SideScreenUtil.exe -ArgumentList '--capture-smoke-test' -Wait -PassThru
          if ($CaptureProcess.ExitCode -ne 0) {
            throw "Packaged capture smoke test failed with exit code $($CaptureProcess.ExitCode)."
          }

      - name: Upload packaged test artifact
        uses: actions/upload-artifact@v7
        with:
          name: SideScreenUtil-ci-windows-x64
          path: dist/SideScreenUtil.exe
          if-no-files-found: error
          retention-days: 7

  verify-native-windows:
    name: Test native slim build on Windows
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Rust
        shell: pwsh
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Run native checks
        shell: pwsh
        run: |
          cargo +stable fmt --manifest-path native\Cargo.toml -- --check
          cargo +stable test --manifest-path native\Cargo.toml --target x86_64-pc-windows-msvc
          cargo +stable build --manifest-path native\Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build native executable
        shell: pwsh
        run: cargo +stable build --manifest-path native\Cargo.toml --release --target x86_64-pc-windows-msvc

      - name: Upload native test artifact
        uses: actions/upload-artifact@v7
        with:
          name: SideScreenUtil-native-ci-windows-x64
          path: native/target/x86_64-pc-windows-msvc/release/sidescreenutil-native.exe
          if-no-files-found: error
          retention-days: 7

      - name: Smoke-test native executable
        shell: pwsh
        run: |
          # Run the non-LTO binary on the hosted, headless desktop. The locally
          # shipped gnullvm executable is smoke-tested separately by build-native.ps1.
          $Exe = ".\native\target\x86_64-pc-windows-msvc\debug\sidescreenutil-native.exe"
          $env:SIDESCREENUTIL_BINARY_SMOKE = "1"
          $Process = Start-Process -FilePath $Exe -PassThru
          Start-Sleep -Seconds 2
          $Process.Refresh()
          Write-Host "Native process state: exited=$($Process.HasExited), title='$($Process.MainWindowTitle)'"
          if (-not $Process.WaitForExit(15000)) {
            Stop-Process -Id $Process.Id -Force
            throw "Native binary smoke test timed out after 15 seconds."
          }
          if ($Process.ExitCode -ne 0) {
            throw "Native binary smoke test failed with exit code $($Process.ExitCode)."
          }
